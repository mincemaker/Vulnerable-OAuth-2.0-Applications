services:
  # gallery is now the GUTS Stack (Go/SQLite) port of insecureapplication/gallery,
  # see ../insecureapplication-go/gallery-idp. It replaces the original
  # Node.js gallery + mongodb + mongoseed services with a single self-seeding
  # binary. container_name stays "gallery" because photoprint and attacker
  # resolve it by that DNS name; no persistent volume is attached so every
  # `docker compose up` starts from the same seed data, matching mongoseed's
  # behavior of re-restoring on every startup.
  gallery:
    build: ../insecureapplication-go/gallery-idp
    container_name: "gallery"
    environment:
      - CLIENT_ID=${CLIENT_ID:-photoprint}
      - CLIENT_SECRET=${CLIENT_SECRET:-secret}
    ports:
      - "3005:3005"
  photoprint:
    build: ./photoprint
    container_name: "photoprint"
    environment:
      - CLIENT_ID=${CLIENT_ID:-photoprint}
      - CLIENT_SECRET=${CLIENT_SECRET:-secret}
      - SESSION_SECRET=${SESSION_SECRET:-changethistoconfigfile}
    ports:
      - "3000:3000"
    depends_on:
      - gallery
  attacker:
    build: ./attacker
    container_name: "attacker"
    environment:
      - CLIENT_ID=${CLIENT_ID:-photoprint}
      - CLIENT_SECRET=${CLIENT_SECRET:-secret}
      - SESSION_SECRET=${SESSION_SECRET:-changethistoconfigfile}
    ports:
      - "1337:1337"
    depends_on:
      - gallery
      - photoprint
  selenium:
    image: selenium/standalone-firefox:latest
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900"