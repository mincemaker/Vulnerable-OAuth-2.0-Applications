version: '3'
services:
  # gallery is now self-seeding SQLite (node:sqlite, built into Node -- no
  # separate DB server, no native npm build step). It replaces the
  # gallery + mongodb + mongoseed services that used to be here; no
  # persistent volume is attached so every `docker-compose up` starts from
  # the same seed data, matching mongoseed's old behavior of re-restoring
  # on every startup. See insecureapplication-go/z-ai/gallery-sqlite-plan.md.
  gallery:
    build: gallery/.
    container_name: "gallery"
    environment:
      - CLIENT_ID=${CLIENT_ID:-photoprint}
      - CLIENT_SECRET=${CLIENT_SECRET:-secret}
    ports:
      - "3005:3005"
  photoprint:
    build: photoprint/.
    container_name: "photoprint"
    environment:
      - CLIENT_ID=${CLIENT_ID:-photoprint}
      - CLIENT_SECRET=${CLIENT_SECRET:-secret}
      - SESSION_SECRET=${SESSION_SECRET:-changethistoconfigfile}
    ports:
      - "3000:3000"
    depends_on:
      - gallery
  attacker:
    build: attacker/.
    container_name: "attacker"
    environment:
      - CLIENT_ID=${CLIENT_ID:-photoprint}
      - CLIENT_SECRET=${CLIENT_SECRET:-secret}
      - SESSION_SECRET=${SESSION_SECRET:-changethistoconfigfile}
    ports:
      - "1337:1337"
    depends_on:
      - gallery
      - photoprint
  selenium:
    image: selenium/standalone-firefox-debug:latest
    ports:
      - "4444:4444"
      - "5900:5900"
